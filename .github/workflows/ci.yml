name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1

      - name: Restore NuGet packages
        run: nuget restore SlingMD.sln

      # The VSTO targets refuse to build with ClickOnce manifest signing turned off, and the
      # project's signing key is not committed. Sign with a throwaway self-signed certificate
      # (what Visual Studio's "Create Test Certificate" does), using a CAPI key provider so the
      # .NET Framework ClickOnce signer can use it.
      - name: Create throwaway signing certificate
        id: cert
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=SlingMD CI" `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1) `
            -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider" -KeySpec Signature
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build (Release)
        run: msbuild SlingMD.sln /p:Configuration=Release /p:SignManifests=true /p:ManifestCertificateThumbprint=${{ steps.cert.outputs.thumbprint }} /p:ManifestKeyFile= /v:minimal /nologo

      - name: Run tests
        run: vstest.console.exe SlingMD.Tests\bin\Release\SlingMD.Tests.dll /Logger:console
